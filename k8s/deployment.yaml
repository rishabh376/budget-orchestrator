apiVersion: apps/v1
kind: Deployment
metadata:
  name: budget-orchestrator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: budget-orchestrator
  template:
    metadata:
      labels:
        app: budget-orchestrator
    spec:
      containers:
      - name: app
        image: ghcr.io/example/budget-orchestrator:latest
        ports:
        - containerPort: 8080
        livenessProbe: { httpGet: { path: /healthz, port: 8080 } }
        readinessProbe: { httpGet: { path: /healthz, port: 8080 } }
